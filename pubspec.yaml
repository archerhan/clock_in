name: clock_in
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  logger: ^2.0.2+1
  flutter_screenutil: ^5.9.0
  path_provider: ^2.1.2
  animated_bottom_navigation_bar: ^1.3.3
  bot_toast: ^4.1.3
  # confetti: ^0.7.0
  table_calendar: ^3.1.0
  flutter_local_notifications: ^17.0.0
  sqflite: ^2.3.2
  flutter_vibrate: ^1.3.0
  intl: ^0.19.0
  fl_chart: ^0.66.2
  flutter_picker: ^2.1.0
  multi_select_flutter: ^4.1.3
  auto_size_text: ^3.0.0
  path: ^1.9.0
  tuple: ^2.0.2
  flutter_animate: ^4.5.0
  awesome_dialog: ^3.2.0
  icloud_storage: ^2.2.0
  timezone: ^0.9.2
  flutter_email_sender: ^6.0.2
  in_app_review: ^2.0.9
  flutter_timezone: ^1.0.8
  in_app_purchase: ^3.1.13
  shared_preferences: ^2.2.2
  flutter_flip_card: ^0.0.5
  url_launcher: ^6.2.5
  intro_slider: ^4.2.1
  flutter_markdown: ^0.7.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner:
  flutter_gen_runner:

flutter:
  uses-material-design: true
  assets:
    - assets/images/common/
    - assets/images/business/
    - assets/images/entertainment/
    - assets/images/family/
    - assets/images/food/
    - assets/images/income/
    - assets/images/medical/
    - assets/images/others/
    - assets/images/shopping/
    - assets/images/skill/
    - assets/images/sport/
    - assets/images/traffic/
    - assets/json/
flutter_gen:
  output: lib/constants/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)
